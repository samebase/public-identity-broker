# Deploys the broker with Alchemy (alchemy.run.ts): a push to main, or Run workflow on main after a
# secret changed, deploys the stage `prod`, the Worker at https://login.samebase.com, and nothing
# else. No pull request gets a preview: a provider accepts only the exact callback address. The state is
# in the `alchemy-state-store` project of the Convex team, under the stack name GITHUB_REPOSITORY.
# Only the Alchemy step gets the secrets.
name: alchemy
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read }
# One run at a time: the state store has no lock. A newer push waits, so the last deploy is the
# newest commit.
concurrency: { group: alchemy-prod, queue: max, cancel-in-progress: false }
jobs:
  alchemy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # A repository without the two deploy tokens deploys nothing and says so before anything is
      # installed.
      - name: Skip without the deploy tokens
        id: keys
        env:
          CONVEX: ${{ secrets.CONVEX_ACCESS_TOKEN }}
          CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CONVEX" ] || [ -z "$CLOUDFLARE" ]; then
            echo "::notice::No deploy: set CONVEX_ACCESS_TOKEN and CLOUDFLARE_API_TOKEN (README, Operate)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.keys.outputs.skip != 'true'
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: steps.keys.outputs.skip != 'true'
        with: { version: 12.16.1 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.keys.outputs.skip != 'true'
        with: { node-version: 26, cache: pnpm }
      - run: pnpm install --frozen-lockfile
        if: steps.keys.outputs.skip != 'true'
      # A re-run of an old run must not put older code over newer code.
      - name: Check that the checkout is the head of main
        if: steps.keys.outputs.skip != 'true'
        env: { TOKEN: "${{ github.token }}" }
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
          head=$(git -c "http.extraheader=AUTHORIZATION: basic $auth" ls-remote origin refs/heads/main | cut -f1)
          if [ "$(git rev-parse HEAD)" != "$head" ]; then
            echo "::error::The checkout is not the head of main ($head). Nothing was deployed."
            exit 1
          fi
      - name: Deploy production
        if: steps.keys.outputs.skip != 'true'
        run: pnpm exec alchemy deploy --stage prod --yes --no-input
        env:
          CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          AUTH_GITHUB_CLIENT_ID: ${{ secrets.AUTH_GITHUB_CLIENT_ID }}
          AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}
          IDENTITY_BROKER_KEYS: ${{ secrets.IDENTITY_BROKER_KEYS }}
          IDENTITY_BROKER_MODERATION_KEY: ${{ secrets.IDENTITY_BROKER_MODERATION_KEY }}
